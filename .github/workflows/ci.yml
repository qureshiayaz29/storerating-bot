name: CI

on:
  push:
    branches: [main]
  pull_request:

permissions:
  contents: read

jobs:
  python:
    runs-on: ubuntu-latest
    services:
      postgres:
        image: postgres:17
        env:
          POSTGRES_PASSWORD: postgres
        ports: ["5432:5432"]
        options: >-
          --health-cmd pg_isready --health-interval 5s --health-timeout 5s --health-retries 10
    env:
      PGPASSWORD: postgres
      DATABASE_URL: postgresql://postgres:postgres@localhost:5432/postgres
      TEST_DATABASE_URL: postgresql://postgres:postgres@localhost:5432/postgres
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
          cache: pip
          cache-dependency-path: job/requirements.txt

      - name: Install dependencies
        run: |
          pip install -r job/requirements.txt
          python -m playwright install --with-deps chromium

      - name: Store Source import guard
        run: python ci/check_imports.py

      - name: Tests (contracts, fetch, alerts, budget)
        run: python -m pytest

      - name: Apply migrations to a throwaway Postgres
        run: |
          # Supabase API roles, so 002_rls.sql runs as it does on Supabase.
          for r in anon authenticated; do
            psql -h localhost -U postgres -v ON_ERROR_STOP=1 -c "do \$\$ begin create role $r nologin; exception when duplicate_object then null; end \$\$"
          done
          for f in db/*.sql; do
            echo "Applying $f"
            psql -h localhost -U postgres -v ON_ERROR_STOP=1 -q -f "$f"
          done

      - name: Every table has Row Level Security
        run: python ci/check_rls.py

      - name: Public roles cannot read data
        run: |
          out=$(psql -h localhost -U postgres -At -c "set role anon; select count(*) from users;" 2>&1 || true)
          echo "$out"
          echo "$out" | grep -q "permission denied"

  web:
    runs-on: ubuntu-latest
    services:
      postgres:
        image: postgres:17
        env:
          POSTGRES_PASSWORD: postgres
        ports: ["5432:5432"]
        options: >-
          --health-cmd pg_isready --health-interval 5s --health-timeout 5s --health-retries 10
    env:
      TEST_DATABASE_URL: postgresql://postgres:postgres@localhost:5432/postgres
    defaults:
      run:
        working-directory: web
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm
          cache-dependency-path: web/package-lock.json

      - name: Install dependencies
        run: npm ci

      - name: Type check
        run: npx astro sync && npm run check

      - name: Tests
        run: npm test

      - name: Build
        run: npm run build
