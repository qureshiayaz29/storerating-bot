name: Record fixtures

# Records real google-play-scraper and App Store output for Contract Fixtures and uploads it
# as an artifact. Nothing is committed automatically: review the files, then
# copy them into contracts/fixtures/ and update the expected files by hand.

on:
  workflow_dispatch:
    inputs:
      large:
        description: Package for the large case
        default: com.whatsapp
      small:
        description: Package for the small case
        default: org.fdroid.fdroid
      removed:
        description: Package that does not exist on Google Play
        default: com.example.storerating.does.not.exist
      ios_large:
        description: App Store key for the large case
        default: ios:in:310633997
      ios_small:
        description: App Store key for the small case
        default: ios:us:1446893455
      ios_removed:
        description: App Store key that does not exist
        default: ios:in:999999999

permissions:
  contents: read

jobs:
  record:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
      - run: pip install -r job/requirements.txt
      - name: Record
        env:
          LARGE: ${{ inputs.large }}
          SMALL: ${{ inputs.small }}
          REMOVED: ${{ inputs.removed }}
          IOS_LARGE: ${{ inputs.ios_large }}
          IOS_SMALL: ${{ inputs.ios_small }}
          IOS_REMOVED: ${{ inputs.ios_removed }}
        run: |
          python -m job.record_fixtures recorded "large=$LARGE" "small=$SMALL" "removed=$REMOVED" \
            "large=$IOS_LARGE" "small=$IOS_SMALL" "removed=$IOS_REMOVED"
      - uses: actions/upload-artifact@v4
        with:
          name: recorded-fixtures
          path: recorded/
          retention-days: 7
