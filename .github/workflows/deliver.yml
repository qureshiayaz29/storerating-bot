name: Deliver

# Every 15 minutes: send today's cards to users whose digest time has arrived.
# One query when nothing is due.
#
# Started by Supabase pg_cron (db/supabase/006_scheduler.sql). GitHub's own
# schedule below proved unreliable (runs 4–6 hours apart) and stays as a backup.

on:
  schedule:
    - cron: "*/30 * * * *"
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: deliver
  cancel-in-progress: false

jobs:
  deliver:
    runs-on: ubuntu-latest
    timeout-minutes: 25
    env:
      DATABASE_URL: ${{ secrets.DATABASE_URL }}
      BOT_TOKEN: ${{ secrets.BOT_TOKEN }}
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
          cache: pip
          cache-dependency-path: job/requirements.txt
      - run: pip install "psycopg[binary]>=3.2"
      - run: python -m job.deliver
